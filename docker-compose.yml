services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payshield
      POSTGRES_USER: payshield
      POSTGRES_PASSWORD: payshield
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payshield -d payshield"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payshield
      SPRING_DATASOURCE_USERNAME: payshield
      SPRING_DATASOURCE_PASSWORD: payshield
    ports: ["8080:8080"]
